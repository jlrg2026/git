<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centro de Gestión de TI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#0f172a;--side:#162033;--card:#1e293b;--hover:#2b3a52;--tx:#f8fafc;--tx2:#a9b6cb;--ac:#60a5fa;--bd:#2f3d55;--up:#22c55e;--down:#ef4444}
[data-theme=light]{--bg:#f1f5f9;--side:#fff;--card:#fff;--hover:#e8eef6;--tx:#0f172a;--tx2:#475569;--ac:#2563eb;--bd:#cbd5e1;--up:#15803d;--down:#b91c1c}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.4 "Segoe UI",system-ui,sans-serif;display:flex}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
aside{width:244px;flex-shrink:0;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;height:100%;transition:transform .2s;z-index:20}
.brand{padding:18px 20px;font-weight:700;font-size:1.1rem;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--bd)}
.brand i{color:var(--ac)}
nav{flex:1;overflow-y:auto;padding:10px 0}
nav button{width:100%;display:flex;align-items:center;gap:12px;padding:11px 20px;color:var(--tx2);text-align:left;border-left:4px solid transparent}
nav button:hover{background:var(--hover);color:var(--tx)}
nav button[aria-current=true]{color:var(--ac);border-left-color:var(--ac);background:var(--hover)}
nav button i{width:18px;text-align:center}
nav button span{margin-left:auto;font-size:.78rem}
.sfoot{padding:12px 20px;border-top:1px solid var(--bd);font-size:.8rem;color:var(--tx2)}
.sfoot button{color:var(--tx2);text-decoration:underline;font-size:.8rem}
.col{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
header{display:flex;gap:10px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--bd);background:var(--side)}
.ib{width:40px;height:40px;border-radius:8px;border:1px solid var(--bd);color:var(--tx2);flex-shrink:0}
.ib:hover{background:var(--hover);color:var(--tx)}
#menu{display:none}
.search{flex:1;max-width:560px;position:relative}
.search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--tx2)}
.search input{width:100%;height:40px;padding:0 54px 0 40px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:.75rem;color:var(--tx2);border:1px solid var(--bd);border-radius:4px;padding:1px 6px}
main{flex:1;overflow-y:auto;padding:24px}
section{margin-bottom:28px}
h2{font-size:1rem;font-weight:600;color:var(--tx2);margin-bottom:12px;display:flex;gap:8px;align-items:center}
h2 span{font-weight:400;font-size:.85rem;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:8px;display:flex}
.card:hover{background:var(--hover);border-color:var(--c)}
.lnk{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:16px 46px 16px 16px;color:inherit;text-decoration:none}
.ic{width:46px;height:46px;border-radius:8px;display:grid;place-items:center;font-size:1.3rem;flex-shrink:0;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.inf{min-width:0;display:flex;flex-direction:column}
.inf b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inf small{color:var(--tx2);font-size:.85rem}
.inf em{font-style:normal;font-size:.75rem;color:#f59e0b;margin-top:2px}
.dot{position:absolute;right:14px;bottom:14px;width:9px;height:9px;border-radius:50%;background:var(--tx2);opacity:.5}
.dot.up{background:var(--up);opacity:1}.dot.down{background:var(--down);opacity:1}
.fav{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:6px;color:var(--tx2);opacity:.55}
.fav:hover,.fav.on{opacity:1}.fav.on{color:#eab308}
.empty{color:var(--tx2);padding:30px 0}
footer{color:var(--tx2);font-size:.82rem;display:flex;gap:16px;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--bd)}
footer i{color:var(--up)}
.scrim{display:none}
@media(max-width:820px){
 aside{position:fixed;left:0;top:0;transform:translateX(-100%)}
 aside.open{transform:none}
 aside.open~.scrim{display:block;position:fixed;inset:0;background:#0008;z-index:10}
 #menu{display:block}header{padding:10px 14px}main{padding:16px 14px}.search kbd{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<aside id="side">
 <div class="brand"><i class="fa-solid fa-server"></i><span>Gestión TI</span></div>
 <nav id="nav" aria-label="Categorías"></nav>
 <div class="sfoot"><button id="reset" type="button">Borrar datos guardados</button></div>
</aside>
<div class="scrim" id="scrim"></div>
<div class="col">
 <header>
  <button class="ib" id="menu" aria-label="Abrir menú"><i class="fa-solid fa-bars"></i></button>
  <label class="search"><i class="fa-solid fa-magnifying-glass"></i>
   <input id="q" type="search" placeholder="Buscar herramienta o enlace…" autocomplete="off" aria-label="Buscar"><kbd>/</kbd></label>
  <button class="ib" id="theme" aria-label="Cambiar tema"><i class="fa-solid fa-circle-half-stroke"></i></button>
 </header>
 <main id="main"></main>
</div>

<script>
/* ===== CONFIGURACIÓN ===== */
const REVISION = '16/11/2026';            // Edita esta fecha cuando actualices los enlaces
const RDP = { host: '', user: '' };       // Déjalos vacíos: el navegador los pedirá una vez y los recordará en ese equipo
const LS = 'https://datastudio.google.com/u/0/reporting/';

/* Categorías: clave -> [nombre, icono] */
const CATS = {
 ops:['Operación','fa-briefcase'], infra:['Infraestructura','fa-network-wired'], srv:['Servidores','fa-server'],
 soporte:['Soporte','fa-headset'], dash:['Dashboards','fa-chart-line'], ia:['Inteligencia artificial','fa-brain']
};

/* Enlaces: n nombre, d descripción, u url, c categoría, i icono, k color, p=1 comprobar estado, x=1 solo red interna, a='rdp' acción */
const L = [
 {id:'cpanel',n:'CPanel',d:'Gestión de correos',u:'https://cpanel.dermavan.mx/',c:'ops',i:'fa-user-gear',k:'#f97316',p:1},
 {id:'crm',n:'CRM Harmony',d:'Relación con clientes',u:'https://smart-scale.site/login',c:'ops',i:'fa-handshake',k:'#8b5cf6',p:1},
 {id:'cotizador',n:'Cotizador',d:'Presupuestos y cotizaciones',u:'https://cotizadordermavan.onrender.com/login',c:'ops',i:'fa-calculator',k:'#22c55e',p:1},
 {id:'powerbi',n:'Power BI',d:'Vistas Dermavan',u:'https://app.powerbi.com/',c:'ops',i:'fa-chart-pie',k:'#eab308'},
 {id:'drive',n:'Google Drive',d:'Archivos compartidos',u:'https://drive.google.com/drive/u/0/my-drive',c:'ops',i:'fa-brands fa-google-drive',k:'#0ea5e9'},
 {id:'issues',n:'Control de issues CRM',d:'Hoja de seguimiento',u:'https://docs.google.com/spreadsheets/d/15K6thzDSZ8GRt6hZdEPacI_OGd1Q-FqVS4NsTeNRtM0/edit?gid=0#gid=0',c:'ops',i:'fa-table',k:'#22c55e'},
 {id:'popl',n:'Portal POPL',d:'Accesorios y tarjetas',u:'https://dash.popl.co/accessories',c:'ops',i:'fa-id-card',k:'#ec4899'},
 {id:'lab',n:'DermavanLab',d:'Plataforma de cursos',u:'https://dermavanlab.com/login/index.php',c:'ops',i:'fa-book',k:'#f43f5e',p:1},

 {id:'inston',n:'Instant On',d:'Monitoreo de WiFi y switches',u:'https://portal.instant-on.hpe.com/login',c:'infra',i:'fa-wifi',k:'#06b6d4'},
 {id:'kyocera',n:'Impresora Kyocera',d:'Panel web de la impresora',u:'http://192.168.1.80/',c:'infra',i:'fa-print',k:'#94a3b8',x:1},
 {id:'infra',n:'Infraestructura',d:'Reporte de infraestructura',u:LS+'27c7fc4f-2a10-4158-ad2c-6109450aab77/page/p_wcuz4aqy4d',c:'infra',i:'fa-network-wired',k:'#3b82f6'},

 {id:'moodle',n:'Servidores Moodle',d:'Plataforma educativa (LMS)',u:'https://www.bluehost.com/my-account/login',c:'srv',i:'fa-graduation-cap',k:'#f43f5e'},
 {id:'sap',n:'Servidores SAP',d:'ERP / gestión empresarial',u:'https://www.bluehost.com/my-account/login',c:'srv',i:'fa-server',k:'#6366f1'},
 {id:'rdp',n:'Escritorio remoto SAP',d:'Descarga el acceso .rdp',u:'#',a:'rdp',c:'srv',i:'fa-desktop',k:'#14b8a6'},

 {id:'ayuda',n:'Mesa de ayuda',d:'Tickets y soporte',u:'https://jlrg2026.github.io/incidentes/',c:'soporte',i:'fa-headset',k:'#14b8a6',p:1},
 {id:'kb',n:'Knowledge Base',d:'Base de conocimiento',u:'https://jlrg2026.github.io/kb2026/',c:'soporte',i:'fa-book-open',k:'#3b82f6',p:1},
 {id:'inv',n:'Inventario',d:'Control de dispositivos y equipos',u:'https://jlrg2026.github.io/inventario/',c:'soporte',i:'fa-boxes-stacked',k:'#10b981',p:1},
 {id:'check',n:'Checklist A/B/C',d:'Revisiones periódicas',u:'https://jlrg2026.github.io/checklist/',c:'soporte',i:'fa-list-check',k:'#f97316',p:1},
 {id:'dexterity',n:'Tickets SAP (Dexterity)',d:'Soporte del proveedor SAP',u:'http://soporte.dexterity.com.mx/open.php',c:'soporte',i:'fa-ticket',k:'#6366f1'},

 {id:'d-backups',n:'Backups de laptops',d:'Dashboard',u:LS+'7968754d-7813-4e17-bb49-f0927fcb4a27/page/C4tsD',c:'dash',i:'fa-hard-drive',k:'#8b5cf6'},
 {id:'d-correo',n:'Correo electrónico',d:'Dashboard',u:LS+'ad6b5923-0485-4232-94ad-1a45f69d0db9/page/USr9C',c:'dash',i:'fa-envelope',k:'#3b82f6'},
 {id:'d-crm',n:'CRM',d:'Dashboard',u:LS+'c8f9310e-3581-4056-a684-7cdfcacb6350/page/RLWeD?s=tNkzGFHoeD4',c:'dash',i:'fa-handshake',k:'#ec4899'},
 {id:'d-dominios',n:'Dominios',d:'Dashboard',u:'https://jlrg2026.github.io/dominios/',c:'dash',i:'fa-globe',k:'#eab308'},
 {id:'d-disp',n:'iPads y laptops',d:'Inventario de dispositivos móviles',u:LS+'699b2ec3-0afb-473d-88be-65c613bc4051/page/cNt9C',c:'dash',i:'fa-tablet-screen-button',k:'#84cc16'},
 {id:'d-lic',n:'Licencias',d:'Dashboard de licencias de software',u:'https://jlrg2026.github.io/licencias/',c:'dash',i:'fa-key',k:'#0ea5e9'},
 {id:'d-wifi',n:'WiFi',d:'Dashboard',u:LS+'27c7fc4f-2a10-4158-ad2c-6109450aab77/page/UrKCD',c:'dash',i:'fa-wifi',k:'#06b6d4'},

 {id:'deepseek',n:'DeepSeek',d:'Asistente de IA',u:'https://chat.deepseek.com/',c:'ia',i:'fa-brain',k:'#3b82f6'},
 {id:'chatgpt',n:'ChatGPT',d:'Asistente de IA',u:'https://chat.openai.com/',c:'ia',i:'fa-comment-dots',k:'#22c55e'}
];

/* ===== ALMACENAMIENTO (tolera que esté bloqueado) ===== */
const st = {
 get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch{return d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},
 del(k){try{localStorage.removeItem(k)}catch{}}
};
let favs = st.get('ti_favs',[]), hits = st.get('ti_hits',{}), cat = 'all', q = '';
const status = {};
const $ = id => document.getElementById(id);
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

/* ===== RENDER ===== */
const card = l => `<div class="card" style="--c:${l.k}">
 <a class="lnk" data-id="${l.id}" ${l.a?`data-a="${l.a}" href="#"`:`href="${l.u}" target="_blank" rel="noopener noreferrer"`} title="${l.d}">
  <span class="ic"><i class="fa-solid ${l.i}"></i></span>
  <span class="inf"><b>${l.n}</b><small>${l.d}</small>${l.x?'<em>Solo red interna</em>':''}</span>
  ${l.p?`<span class="dot" data-p="${l.id}" title="Comprobando…"></span>`:''}
 </a>
 <button class="fav ${favs.includes(l.id)?'on':''}" data-f="${l.id}" aria-pressed="${favs.includes(l.id)}" aria-label="${favs.includes(l.id)?'Quitar de favoritos':'Añadir a favoritos'}"><i class="fa-solid fa-star"></i></button>
</div>`;
const sec = (t,ic,arr) => arr.length ? `<section><h2><i class="fa-solid ${ic}"></i>${t}<span>${arr.length}</span></h2><div class="grid">${arr.map(card).join('')}</div></section>` : '';

function render(){
 let h = '';
 if(q){
  const r = L.filter(l => norm(l.n+' '+l.d+' '+CATS[l.c][0]).includes(q));
  h = sec('Resultados','fa-magnifying-glass',r) || '<p class="empty">Sin resultados. Prueba con otra palabra.</p>';
 } else if(cat==='all'){
  const top = Object.entries(hits).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]).map(e=>L.find(l=>l.id===e[0])).filter(Boolean).slice(0,6);
  h = sec('Favoritos','fa-star',L.filter(l=>favs.includes(l.id))) + sec('Más usados','fa-clock-rotate-left',top);
  h += Object.keys(CATS).map(c => sec(CATS[c][0],CATS[c][1],L.filter(l=>l.c===c))).join('');
 } else {
  h = sec(CATS[cat][0],CATS[cat][1],L.filter(l=>l.c===cat));
 }
 h += `<footer><span><i class="fa-solid fa-circle-check"></i> Última revisión de enlaces: ${REVISION}</span><span>Atajos: <b>/</b> o <b>Ctrl+K</b> buscar · <b>Esc</b> limpiar · <b>Enter</b> abrir el primer resultado</span></footer>`;
 $('main').innerHTML = h;
 paintDots();
}
function renderNav(){
 const item = (k,n,ic,c) => `<button data-c="${k}" ${cat===k&&!q?'aria-current="true"':''}><i class="fa-solid ${ic}"></i>${n}<span>${c}</span></button>`;
 $('nav').innerHTML = item('all','Inicio','fa-house',L.length) + Object.keys(CATS).map(c=>item(c,CATS[c][0],CATS[c][1],L.filter(l=>l.c===c).length)).join('');
}
function paintDots(){
 document.querySelectorAll('[data-p]').forEach(d=>{
  const s = status[d.dataset.p];
  d.className = 'dot ' + (s===1?'up':s===0?'down':'');
  d.title = s===1?'Responde':s===0?'Sin respuesta (puede estar dormido o caído)':'Comprobando…';
 });
}

/* ===== ESTADO DE SERVICIOS (ping simple, solo indica si el sitio responde) ===== */
L.filter(l=>l.p).forEach(l=>
 fetch(l.u,{mode:'no-cors',cache:'no-store',signal:AbortSignal.timeout(7000)})
  .then(()=>status[l.id]=1).catch(()=>status[l.id]=0).finally(paintDots));

/* ===== ESCRITORIO REMOTO SIN DATOS EN EL CÓDIGO ===== */
function rdp(){
 let h = RDP.host || st.get('ti_rdp_host',''), u = RDP.user || st.get('ti_rdp_user','');
 if(!h) h = (prompt('Servidor SAP (IP:puerto):')||'').trim();
 if(!h) return;
 if(!u) u = (prompt('Usuario (DOMINIO\\usuario):')||'').trim();
 if(!u) return;
 st.set('ti_rdp_host',h); st.set('ti_rdp_user',u);
 const url = URL.createObjectURL(new Blob([`full address:s:${h}\r\nusername:s:${u}\r\n`],{type:'application/x-rdp'}));
 const a = Object.assign(document.createElement('a'),{href:url,download:'Conexion_SAP.rdp'});
 document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

/* ===== EVENTOS ===== */
document.addEventListener('click', e => {
 const lnk = e.target.closest('.lnk');
 if(lnk){
  hits[lnk.dataset.id] = (hits[lnk.dataset.id]||0)+1; st.set('ti_hits',hits);
  if(lnk.dataset.a==='rdp'){ e.preventDefault(); rdp(); }
  return;
 }
 const f = e.target.closest('.fav');
 if(f){
  const id = f.dataset.f;
  favs = favs.includes(id) ? favs.filter(x=>x!==id) : [...favs,id];
  st.set('ti_favs',favs); render(); return;
 }
 const c = e.target.closest('#nav button');
 if(c){ cat = c.dataset.c; q = ''; $('q').value = ''; renderNav(); render(); $('side').classList.remove('open'); $('main').scrollTop = 0; }
});
$('q').addEventListener('input', e => { q = norm(e.target.value.trim()); renderNav(); render(); });
$('q').addEventListener('keydown', e => {
 if(e.key==='Enter'){ const a = $('main').querySelector('.lnk'); if(a) a.click(); }
 if(e.key==='Escape'){ e.target.value=''; q=''; e.target.blur(); renderNav(); render(); }
});
document.addEventListener('keydown', e => {
 const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
 if((e.key==='/' && !typing) || ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k')){ e.preventDefault(); $('q').focus(); $('q').select(); }
});
$('menu').onclick = () => $('side').classList.toggle('open');
$('scrim').onclick = () => $('side').classList.remove('open');
$('reset').onclick = () => {
 if(!confirm('¿Borrar favoritos, historial de uso y datos de escritorio remoto guardados en este navegador?')) return;
 ['ti_favs','ti_hits','ti_rdp_host','ti_rdp_user'].forEach(st.del); favs=[]; hits={}; render();
};

/* Tema: respeta la preferencia guardada o la del sistema */
const setTheme = t => { document.documentElement.dataset.theme = t; st.set('ti_theme',t); };
setTheme(st.get('ti_theme', matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
$('theme').onclick = () => setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

renderNav(); render();
</script>
</body>
</html>
